<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var M = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  var cur = null, au = null, sp = false, karte = null;
  function stop() { sp = false; if (au) { au.pause(); au = null; } if ('speechSynthesis' in window) speechSynthesis.cancel(); $('w-read').classList.remove('spielt'); $('w-read').setAttribute('aria-label', 'Anhören'); }
  function speech(e) {
    if (!('speechSynthesis' in window)) { stop(); return; }
    var p = (e.sprech || e.text).match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [e.text]; sp = true;
    (function n() { if (!sp) return; if (!p.length) { stop(); return; } var u = new SpeechSynthesisUtterance(p.shift()); u.lang = 'de-DE'; u.rate = .95; u.onend = n; u.onerror = function (er) { if (!er || (er.error !== 'canceled' && er.error !== 'interrupted')) stop(); }; speechSynthesis.speak(u); })();
  }
  $('w-read').addEventListener('click', function () {
    if (au || sp) { stop(); return; }
    $('w-read').classList.add('spielt'); $('w-read').setAttribute('aria-label', 'Stopp');
    var a = new Audio('audio/welterbe-' + encodeURIComponent(cur.id) + '.mp3'); au = a;
    a.onended = stop; a.onerror = function () { au = null; speech(cur); };
    var r = a.play(); if (r && r.catch) r.catch(function () { if (au === a) { au = null; speech(cur); } });
  });
  window.addEventListener('pagehide', stop);
  function datum(d) { var x = d.split('-'); return parseInt(x[2], 10) + '.' + parseInt(x[1], 10) + '.' + x[0]; }
  function show(e) {
    stop(); cur = e;
    $('w-kicker').textContent = 'Welterbe der Woche · ' + datum(e.date);
    $('w-title').textContent = e.titel; $('w-by').textContent = e.ort + ' · seit ' + e.seit;
    $('w-text').innerHTML = ''; e.text.split('\n\n').forEach(function (t) { var p = document.createElement('p'); p.textContent = t; $('w-text').appendChild(p); });
    var s = $('w-src'); s.href = e.quelle.url; s.textContent = 'Quelle: ' + e.quelle.titel;
    var f = $('w-foto'), b = e.bild;
    if (b && b.datei) {
      var im = $('w-img'); im.onerror = function () { f.hidden = true; $('w-act').appendChild($('w-read')); };
      im.src = 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(b.datei) + '?width=1000'; im.alt = b.alt || e.titel;
      var c = $('w-cap'); c.textContent = 'Foto: ' + b.autor + ' · ' + b.lizenz + ' · '; var a = document.createElement('a'); a.href = b.seite; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Wikimedia Commons'; c.appendChild(a); f.hidden = false; $('w-imgbox').appendChild($('w-read'));
    } else { f.hidden = true; $('w-act').appendChild($('w-read')); }
    var kb = $('w-karte');
    if (window.L && typeof e.lat === 'number' && typeof e.lon === 'number') {
      kb.hidden = false;
      if (karte) { karte.remove(); karte = null; }
      karte = L.map(kb, { scrollWheelZoom: false }).setView([e.lat, e.lon], 11);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(karte);
      L.marker([e.lat, e.lon]).addTo(karte).bindPopup(e.titel);
    } else kb.hidden = true;
    document.title = e.titel + ' – UNESCO-Welterbe';
    $('wh').classList.remove('song-wait');
  }
  fetch('data/welterbe.json').then(function (r) { return r.json(); }).then(function (l) {
    l = l.filter(function (x) { return x && x.titel; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var id = new URLSearchParams(location.search).get('id');
    var e = l.filter(function (x) { return x.id === id; })[0] || l[0];
    if (!e) throw 0;
    show(e);
    $('w-list').innerHTML = '';
    l.forEach(function (x) { var li = document.createElement('li'), a = document.createElement('a'), b = document.createElement('b'), sp2 = document.createElement('span');
      a.href = 'welterbe.html?id=' + encodeURIComponent(x.id); b.textContent = x.titel; sp2.textContent = x.ort + ' · ' + datum(x.date); a.appendChild(b); a.appendChild(sp2); li.appendChild(a); $('w-list').appendChild(li); });
  }).catch(function () { $('w-error').hidden = false; });
})();
</script>
