<style>

<body>
<div class="wrap">

  <a class="back-link" href="../index.html">← Zur Übersicht</a>

  <article>
    <header class="entry-header">
      <p class="date">29. August 2026</p>
      <h1>Ankunft auf Fischland-Darß</h1>
      <hr class="rule">
    </header>

    <figure class="photo photo-full">
      <div class="frame"><img src="darss-1.jpg" alt="Erstes Fischbroetchen nach der Ankunft"></div>
      <figcaption>Angekommen – und sofort das erste Fischbrötchen</figcaption>
    </figure>

    <div class="entry-body">
      <p>Erster Tag auf Fischland-Darß: angekommen, und keine Frage – sofort gab's das erste Fischbrötchen. Abends waren wir dann im "Walfisch" essen.</p>
    </div>

    <figure class="photo photo-full">
      <div class="frame"><img src="darss-2.jpg" alt="Am Strand von Fischland-Darss"></div>
      <figcaption>Erster Strandspaziergang am Abend</figcaption>
    </figure>

    <figure class="photo photo-full">
      <div class="frame"><img src="darss-3.jpg" alt="Kalli mit Sand an der Nase"></div>
      <figcaption>Kalli hat schon mal die Nase in den Sand gesteckt</figcaption>
    </figure>

    <figure class="photo photo-full">
      <div class="frame"><img src="darss-4.jpg" alt="Abendspaziergang am Hafen"></div>
      <figcaption>Abends am Hafen unterwegs</figcaption>
    </figure>

    <figure class="photo photo-full">
      <div class="frame"><img src="darss-5.jpg" alt="Am Hafen in der Abenddaemmerung"></div>
      <figcaption>Auf dem Weg zum "Walfisch"</figcaption>
    </figure>

    <figure class="photo photo-full">
      <div class="frame"><img src="darss-6.jpg" alt="Kalli in den Duenen von Fischland-Darss"></div>
      <figcaption>Kalli erkundet die Dünen</figcaption>
    </figure>

    <figure class="map-block">
      <div id="route-map"></div>
      <figcaption>Wo die Reise begann</figcaption>
    </figure>
  </article>

  <footer class="site-footer">

  </footer>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var stops = [
    [54.377667, 12.416458, "Fischbrötchen"],
    [54.397603, 12.443361, "Strandspaziergang"],
    [54.408222, 12.456069, "Kalli in den Dünen"],
    [54.382106, 12.530269, "Abends am Hafen"]
  ];
  var map = L.map('route-map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap-Mitwirkende',
    maxZoom: 17
  }).addTo(map);
  var latlngs = [];
  stops.forEach(function (s, i) {
    L.marker([s[0], s[1]]).addTo(map).bindPopup((i + 1) + '. ' + s[2]);
    latlngs.push([s[0], s[1]]);
  });
  map.fitBounds(latlngs, { padding: [20, 20] });
</script>
