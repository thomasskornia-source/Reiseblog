<body>
<div class="wrap">

  <a class="back-link" href="../index.html">← Zur Übersicht</a>

  <article>
    <header class="entry-header">
      <p class="date">8.–9. September 2026</p>

      <hr class="rule">
    </header>

    <figure class="photo photo-full">
      <div class="frame"><img src="ruegen-eindruecke-1.jpg" alt="Kalli am Strand in Baabe"></div>
      <figcaption>Kalli direkt am ersten Abend im Wasser</figcaption>
    </figure>

    <div class="entry-body">
      <p>Angekommen auf Rügen – die ersten Tage zum Ankommen und Erkunden, bevor die große Bornholm-Radtour losgeht.</p>
    </div>

    <figure class="photo photo-full">
      <div class="frame"><img src="ruegen-eindruecke-2.jpg" alt="Seebruecke Sellin bei Sonnenuntergang"></div>
      <figcaption>Die Seebrücke Sellin in der Abenddämmerung</figcaption>
    </figure>

      <div id="route-map"></div>
      <figcaption>Wo diese Tage stattfanden</figcaption>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var stops = [
    [54.294, 13.715, "Baabe"],
    [54.383, 13.698, "Seebrücke Sellin"]
  ];
  var map = L.map('route-map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap-Mitwirkende',
    maxZoom: 17
  }).addTo(map);
  var latlngs = [];
  stops.forEach(function (s, i) {
    L.marker([s[0], s[1]]).addTo(map).bindPopup((i + 1) + '. ' + s[2]);
    latlngs.push([s[0], s[1]]);
  });
  map.fitBounds(latlngs, { padding: [20, 20] });
</script>
