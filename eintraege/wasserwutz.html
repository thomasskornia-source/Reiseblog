    <figure class="photo photo-full">
      <div class="frame"><img src="wasserwutz-2.jpg" alt="Kalli im Wasser bei Baabe"></div>

    <figure class="photo photo-full">
      <div class="frame">
        <video controls playsinline preload="metadata" poster="wasserwutz-video-1-poster.jpg">

        </video>
      </div>
      <figcaption>Schwimmrunde Nummer eins</figcaption>

    <figure class="photo photo-full">
      <div class="frame">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var stops = [
    [54.360155, 13.720138, "Unsere Wasserwutz"]
  ];
  var map = L.map('route-map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap-Mitwirkende',
    maxZoom: 17
  }).addTo(map);
  stops.forEach(function (s, i) {
    L.marker([s[0], s[1]]).addTo(map).bindPopup((i + 1) + '. ' + s[2]);
  });
  map.setView([stops[0][0], stops[0][1]], 15);
</script>
