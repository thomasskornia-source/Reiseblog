<head>

<link rel="stylesheet" href="../styles.css">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icon-180.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="../lightbox.js" defer></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    await OneSignal.init({
      appId: "94272d78-1aff-4896-9677-75367a0bbf13",
      serviceWorkerPath: "OneSignalSDKWorker.js",
      serviceWorkerParam: { scope: "/Reiseblog/" }
    });
  });
</script>
<style>
  #route-map { height: 260px; width: 100%; border: 1px solid rgba(46, 58, 50, 0.12); }
  .leaflet-popup-content { font-family: 'Work Sans', sans-serif; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">

  <a class="back-link" href="../index.html">← Zur Übersicht</a>

  <article>
    <header class="entry-header">
      <p class="date">10. September 2026</p>
      <h1>Kalli beim Frühstück</h1>
      <hr class="rule">
    </header>

    <figure class="photo photo-full">
      <div class="frame"><img src="baabe-1.jpg" alt="Kalli kugelt sich vor Vergnügen auf dem Boden"></div>
      <figcaption>Kalli kugelt sich vor Vergnügen</figcaption>
    </figure>

    <figure class="photo photo-full">
      <div class="frame"><img src="baabe-2.jpg" alt="Kalli erwischt beim Naschen am Frühstückstisch"></div>
      <figcaption>Erwischt beim Naschen</figcaption>
    </figure>

    <div class="entry-body">
      <p>Kalli beim Frühstück – der Süße.</p>
    </div>

    <figure class="map-block">
      <div id="route-map"></div>
      <figcaption>Wo dieser Morgen stattfand</figcaption>
    </figure>
  </article>

  <footer class="site-footer">
    <p>Automatisch erstellt aus Fotos und Sprachnotizen unterwegs.</p>
  </footer>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var stops = [
    [54.355361, 13.701628, "Kalli beim Frühstück"]
  ];
  var map = L.map('route-map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap-Mitwirkende',
    maxZoom: 17
  }).addTo(map);
  stops.forEach(function (s, i) {
    L.marker([s[0], s[1]]).addTo(map).bindPopup((i + 1) + '. ' + s[2]);
  });
  map.setView([stops[0][0], stops[0][1]], 14);
</script>
</body>
