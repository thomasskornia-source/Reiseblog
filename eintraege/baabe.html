<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baabe – Andrea unterwegs</title>
<link rel="stylesheet" href="../styles.css">
<script src="../lightbox.js" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.notify-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!btn.dataset.ready) btn.textContent = '⏳ Verbinde …';
      });
    });
  });
</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer
  onerror="document.querySelectorAll('.notify-btn').forEach(function(b){b.textContent='⚠️ Skript blockiert/nicht geladen';})"></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    try {
      await Promise.race([
        OneSignal.init({ appId: "94272d78-1aff-4896-9677-75367a0bbf13" }),
        new Promise(function (_, reject) {
          setTimeout(function () { reject(new Error('Zeitüberschreitung nach 6s')); }, 6000);
        })
      ]);
    } catch (err) {
      document.querySelectorAll('.notify-btn').forEach(function (btn) {
        btn.textContent = '⚠️ Init-Fehler: ' + (err && err.message ? err.message : String(err));
      });
      return;
    }

    function refreshNotifyButtons() {
      var enabled = OneSignal.Notifications.permission === true;
      document.querySelectorAll('.notify-btn').forEach(function (btn) {
        btn.dataset.ready = '1';
        btn.textContent = enabled ? '🔔 Benachrichtigungen aktiv' : '🔔 Benachrichtigungen aktivieren';
        btn.classList.toggle('subscribed', enabled);
      });
    }

    document.querySelectorAll('.notify-btn').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        try {
          await OneSignal.Notifications.requestPermission();
        } catch (e) {
          btn.textContent = '⚠️ ' + (e && e.message ? e.message : String(e));
          return;
        }
        refreshNotifyButtons();
      });
    });

    refreshNotifyButtons();
  });
</script>
</head>
<body>
<div class="wrap">

  <div class="entry-topbar">
    <a class="back-link" href="../index.html">← Zur Übersicht</a>
    <button class="notify-btn">🔔 Benachrichtigungen aktivieren</button>
  </div>

  <article>
    <header class="entry-header">
      <p class="date">10. September 2026</p>
      <h1>Baabe</h1>
      <hr class="rule">
    </header>

    <div class="photo-row">
      <figure class="photo">
        <div class="frame"><img src="baabe-1.jpg" alt="Kalli kugelt sich vor Vergnügen auf dem Boden"></div>
        <figcaption>Kalli kugelt sich vor Vergnügen</figcaption>
      </figure>
      <figure class="photo">
        <div class="frame"><img src="baabe-2.jpg" alt="Kalli erwischt beim Naschen am Frühstückstisch"></div>
        <figcaption>Erwischt beim Naschen</figcaption>
      </figure>
    </div>

    <figure class="map-block">
      <div class="frame">
        <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=13.681632%2C54.335362%2C13.721632%2C54.375362&marker=54.355362%2C13.701632&layer=mapnik" loading="lazy" title="Standort Baabe"></iframe>
      </div>
      <figcaption>Wo dieser Morgen stattfand</figcaption>
    </figure>

    <div class="entry-body">
      <p>Kalli beim Frühstück – der Süße.</p>
    </div>
  </article>

  <footer class="site-footer">
    <p>Automatisch erstellt aus Fotos und Sprachnotizen unterwegs.</p>
  </footer>

</div>
</body>
</html>
