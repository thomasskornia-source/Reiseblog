    <header class="entry-header">

    <figure class="photo photo-full">
      <div class="frame"><img src="insel-brauerei-1.jpg" alt="Regal mit Bieren der Insel-Brauerei Ruegen"></div>
      <figcaption>Ein ganzes Regal voller Rügener Bierspezialitäten</figcaption>
    </figure>

    <div class="entry-body">
      <p>Nachmittags ein Abstecher zur Insel-Brauerei auf Rügen – von Baltic Ale bis Tripel ist für jeden Geschmack was dabei.</p>

    <figure class="photo photo-full">
      <div class="frame"><img src="insel-brauerei-2.jpg" alt="Flasche Baltic Tripel der Insel-Brauerei"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var stops = [ [54.354, 13.201, "Insel-Brauerei"] ];
  var map = L.map('route-map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap-Mitwirkende',
    maxZoom: 17
  }).addTo(map);
  stops.forEach(function (s, i) {
    L.marker([s[0], s[1]]).addTo(map).bindPopup((i + 1) + '. ' + s[2]);
  });
  map.setView([stops[0][0], stops[0][1]], 14);
</script>
