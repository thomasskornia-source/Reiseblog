<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {

      appId: "94272d78-1aff-4896-9677-75367a0bbf13",

</script>
<style>
  #route-map { height: 260px; width: 100%; border: 1px solid rgba(46, 58, 50, 0.12); }
</style>

<body>
<div class="wrap">

  <a class="back-link" href="../index.html">← Zur Übersicht</a>

  <article>
    <header class="entry-header">
      <p class="date">10. September 2026</p>
      <h1>Am Hafen in Wiek</h1>
      <hr class="rule">
    </header>

    <figure class="photo photo-full">
      <div class="frame"><img src="wiek-hafen-1.jpg" alt="Kalli entspannt auf dem Boden"></div>
      <figcaption>Erstmal ausschlafen ...</figcaption>
    </figure>

    <figure class="photo photo-full">
      <div class="frame"><img src="wiek-hafen-2.jpg" alt="Kalli bettelt am Fruehstueckstisch"></div>
      <figcaption>... und beim Frühstück ein Auge auf den Tisch haben</figcaption>
    </figure>

    <div class="entry-body">
      <p>Vormittags ging's an den kleinen Hafen von Wiek im Nordwesten Rügens – Segelboote, Schilf und viel Ruhe.</p>
    </div>

    <figure class="photo photo-full">
      <div class="frame"><img src="wiek-hafen-3.jpg" alt="Hafen Wiek mit Segelbooten"></div>
      <figcaption>Der kleine Hafen von Wiek</figcaption>
    </figure>

    <figure class="photo photo-full">
      <div class="frame"><img src="wiek-hafen-4.jpg" alt="Andrea und Kalli am Hafen Wiek"></div>
      <figcaption>Andrea und Kalli am Steg</figcaption>
    </figure>



    <figure class="photo photo-full">
      <div class="frame"><img src="schaprode-bonus-2.jpg" alt="Boote im Hafenbecken"></div>
      <figcaption>Boote im Hafenbecken</figcaption>
    </figure>

    <figure class="photo photo-full">
      <div class="frame"><img src="schaprode-bonus-3.jpg" alt="Blick zur Kirche"></div>
      <figcaption>Blick zur Kirche</figcaption>
    </figure>


    <figure class="photo photo-full">
      <div class="frame"><img src="schaprode-bonus-5.jpg" alt="Ruhiger Nachmittag am Wasser"></div>
      <figcaption>Ruhiger Nachmittag am Wasser</figcaption>
    </figure>

    <figure class="map-block">
      <div id="route-map"></div>
      <figcaption>Der Hafen von Wiek</figcaption>
    </figure>
  </article>

  <footer class="site-footer">
    <p>Automatisch erstellt aus Fotos und Sprachnotizen unterwegs.</p>
  </footer>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var stops = [ [54.511, 13.169, "Hafen Wiek"] ];
  var map = L.map('route-map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap-Mitwirkende',
    maxZoom: 17
  }).addTo(map);
  stops.forEach(function (s, i) {
    L.marker([s[0], s[1]]).addTo(map).bindPopup((i + 1) + '. ' + s[2]);
  });
  map.setView([stops[0][0], stops[0][1]], 14);
</script>
</body>
