<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sundowner am Hafen – Andrea unterwegs</title>
<link rel="stylesheet" href="../styles.css">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Andrea unterwegs">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="../lightbox.js" defer></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    await OneSignal.init({
      appId: "94272d78-1aff-4896-9677-75367a0bbf13",
      serviceWorkerPath: "OneSignalSDKWorker.js",
      serviceWorkerParam: { scope: "/Reiseblog/" }
    });
  });
</script>
<style>
  #route-map { height: 280px; width: 100%; border: 1px solid rgba(46, 58, 50, 0.12); }
  .leaflet-popup-content { font-family: 'Work Sans', sans-serif; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">

  <a class="back-link" href="../index.html">← Zur Übersicht</a>

  <article>
    <header class="entry-header">
      <p class="date">10. September 2026</p>
      <h1>Sundowner am Hafen</h1>
      <hr class="rule">
    </header>

    <figure class="photo photo-full">
      <div class="frame"><img src="sundowner-1.jpg" alt="Waldweg im Abendlicht"></div>
      <figcaption>Auf dem Weg durch den Wald</figcaption>
    </figure>

    <figure class="photo photo-full">
      <div class="frame"><img src="sundowner-2.jpg" alt="Blick auf den Hafen"></div>
      <figcaption>Der Hafen taucht auf</figcaption>
    </figure>

    <div class="entry-body">
      <p>Kurzer Ausflug noch zum Hafen für einen Sundowner heute Abend, mit Blick übers Wasser.</p>
    </div>

    <figure class="photo photo-full">
      <div class="frame"><img src="sundowner-3.jpg" alt="Bootsbar am Hafen"></div>
      <figcaption>Die Bootsbar direkt am Wasser</figcaption>
    </figure>

    <figure class="photo photo-full">
      <div class="frame"><img src="sundowner-4.jpg" alt="Sonnenuntergang zwischen den Segelbooten"></div>
      <figcaption>Sonnenuntergang zwischen den Masten</figcaption>
    </figure>

    <figure class="photo photo-full">
      <div class="frame"><img src="sundowner-6.jpg" alt="Thomas und Kalli auf einer Bank im Abendlicht"></div>
      <figcaption>Kurze Rast mit Kalli im Abendlicht</figcaption>
    </figure>

    <figure class="photo photo-full">
      <div class="frame"><img src="sundowner-5.jpg" alt="Segelboote im Abendlicht"></div>
      <figcaption>Ein perfekter Abschluss des Tages</figcaption>
    </figure>

    <figure class="map-block">
      <div id="route-map"></div>
      <figcaption>Der Weg zum Hafen</figcaption>
    </figure>
  </article>

  <footer class="site-footer">
    <p>Automatisch erstellt aus Fotos und Sprachnotizen unterwegs.</p>
  </footer>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var stops = [
    [54.34298, 13.69342, "Auf dem Weg durch den Wald"],
    [54.35034, 13.68568, "Der Hafen taucht auf"],
    [54.35068, 13.68648, "Die Bootsbar"],
    [54.35071, 13.68579, "Sonnenuntergang"],
    [54.35035, 13.68561, "Kurze Rast mit Kalli"],
    [54.35032, 13.68549, "Abschluss des Tages"]
  ];
  var map = L.map('route-map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap-Mitwirkende',
    maxZoom: 18
  }).addTo(map);
  var latlngs = [];
  stops.forEach(function (s, i) {
    L.marker([s[0], s[1]]).addTo(map).bindPopup((i + 1) + '. ' + s[2]);
    latlngs.push([s[0], s[1]]);
  });
  L.polyline(latlngs, { color: '#B5502E', weight: 3, opacity: 0.7 }).addTo(map);
  map.fitBounds(latlngs, { padding: [30, 30] });
</script>
</body>
</html>
