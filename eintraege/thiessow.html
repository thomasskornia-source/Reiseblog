<div class="wrap">

  <a class="back-link" href="../index.html">← Zur Übersicht</a>

  <article>

    <div class="photo-duo uneven">

        <div class="frame"><img src="thiessow-1.jpg" alt="Weiter Sandstrand in Thiessow am Abend"></div>

      <figure class="photo tilt-right">
        <div class="frame"><img src="thiessow-2.jpg" alt="Kitesurfer-Schirm über den Dünen"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var stops = [
    [54.293703, 13.714931, "Der weite Strand am Abend"],
    [54.279675, 13.697878, "Ein Kite hoch über den Dünen"],
    [54.276856, 13.70345, "Sonnenuntergang zum Abschluss"]
  ];
  var map = L.map('route-map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap-Mitwirkende',
    maxZoom: 17
  }).addTo(map);
  var latlngs = [];
  stops.forEach(function (s, i) {
    L.marker([s[0], s[1]]).addTo(map).bindPopup((i + 1) + '. ' + s[2]);
    latlngs.push([s[0], s[1]]);
  });
  L.polyline(latlngs, { color: '#B5502E', weight: 3, opacity: 0.7 }).addTo(map);
  map.fitBounds(latlngs, { padding: [30, 30] });
</script>
</body>
