<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thiessow – Andrea unterwegs</title>
<link rel="stylesheet" href="../styles.css">
<script src="../lightbox.js" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.notify-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!btn.dataset.ready) btn.textContent = '⏳ Verbinde …';
      });
    });
  });
</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer
  onerror="document.querySelectorAll('.notify-btn').forEach(function(b){b.textContent='⚠️ Skript blockiert/nicht geladen';})"></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    try {
      await OneSignal.init({ appId: "94272d78-1aff-4896-9677-75367a0bbf13" });
    } catch (err) {
      document.querySelectorAll('.notify-btn').forEach(function (btn) {
        btn.textContent = '⚠️ Init-Fehler: ' + (err && err.message ? err.message : String(err));
      });
      return;
    }

    function refreshNotifyButtons() {
      var enabled = OneSignal.Notifications.permission === true;
      document.querySelectorAll('.notify-btn').forEach(function (btn) {
        btn.dataset.ready = '1';
        btn.textContent = enabled ? '🔔 Benachrichtigungen aktiv' : '🔔 Benachrichtigungen aktivieren';
        btn.classList.toggle('subscribed', enabled);
      });
    }

    document.querySelectorAll('.notify-btn').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        try {
          await OneSignal.Notifications.requestPermission();
        } catch (e) {
          btn.textContent = '⚠️ ' + (e && e.message ? e.message : String(e));
          return;
        }
        refreshNotifyButtons();
      });
    });

    refreshNotifyButtons();
  });
</script>
</head>
<body>
<div class="wrap">

  <div class="entry-topbar">
    <a class="back-link" href="../index.html">← Zur Übersicht</a>
    <button class="notify-btn">🔔 Benachrichtigungen aktivieren</button>
  </div>

  <article>
    <header class="entry-header">
      <p class="date">8. September 2026</p>
      <h1>Thiessow</h1>
      <hr class="rule">
    </header>

    <div class="photo-row">
      <figure class="photo">
        <div class="frame"><img src="thiessow-1.jpg" alt="Weiter Sandstrand in Thiessow am Abend"></div>
        <figcaption>Der weite Strand am Abend</figcaption>
      </figure>
      <figure class="photo">
        <div class="frame"><img src="thiessow-2.jpg" alt="Kitesurfer-Schirm über den Dünen"></div>
        <figcaption>Ein Kite hoch über den Dünen</figcaption>
      </figure>
      <figure class="photo">
        <div class="frame"><img src="thiessow-3.jpg" alt="Sonnenuntergang über den Dünen von Thiessow"></div>
        <figcaption>Sonnenuntergang zum Abschluss</figcaption>
      </figure>
    </div>

    <figure class="map-block">
      <div class="frame">
        <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=13.677967%2C54.259670%2C13.717967%2C54.299670&marker=54.279670%2C13.697880&layer=mapnik" loading="lazy" title="Standort Thiessow"></iframe>
      </div>
      <figcaption>Wo dieser Abend stattfand</figcaption>
    </figure>

    <div class="entry-body">
      <p>Schöne Abendaufnahmen am Strand von Thiessow.</p>
    </div>
  </article>

  <footer class="site-footer">
    <p>Automatisch erstellt aus Fotos und Sprachnotizen unterwegs.</p>
  </footer>

</div>
</body>
</html>
