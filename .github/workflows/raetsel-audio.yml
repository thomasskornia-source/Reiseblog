name: Bayern-Rätsel – Audio

on:
  push:
    branches: [main]
    paths:
      - 'data/raetsel.json'
      - 'tools/raetsel-audio.py'
  schedule:
    - cron: '20 0 * * *'   # nach dem Zurücksetzen des Tageslimits (Mitternacht UTC)
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg installieren
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: edge-tts installieren
        run: pip install --quiet edge-tts
      - name: Audiodateien erzeugen (Gemini, ersatzweise Seraphina)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          python3 tools/raetsel-audio.py 2>&1 | tee audio/last-raetsel.log
      - name: Audiodateien hochladen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Bayern-Rätsel: Audio ergänzt"
          git pull --rebase origin main
          git push origin HEAD:main
