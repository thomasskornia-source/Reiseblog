name: Eichhorn Stillhalter-Regeln

on:
  schedule:
    - cron: '20 5 * * *'   # täglich ca. 06:20/07:20 deutsche Zeit, neue Folge wird ausgewertet
  workflow_dispatch:
    inputs:
      seed:
        description: 'Video-Links oder IDs (optional, durch Leerzeichen getrennt)'
        required: false
      backfill:
        description: 'Zahl älterer Videos aus dem Feed nachholen (z. B. 5)'
        required: false
      neu:
        description: 'Leer lassen; "ja" wertet die angegebenen Videos erneut aus'
        required: false

permissions:
  contents: write

concurrency:
  group: eichhorn

jobs:
  eichhorn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Folgen auswerten (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEED_VIDEOS: ${{ inputs.seed }}
          BACKFILL: ${{ inputs.backfill }}
          NEU: ${{ inputs.neu }}
        run: |
          mkdir -p auswertung
          set -o pipefail
          python3 -u tools/eichhorn-sammeln.py 2>&1 | tee auswertung/eichhorn-last-run.log
      - name: Daten ablegen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data auswertung
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Eichhorn: neue Auswertung"
          git pull --rebase origin main
          git push origin HEAD:main
