name: Stimmen-Vergleich (einmalig)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stimmen installieren und Proben erzeugen
        run: |
          pip install edge-tts piper-tts
          python3 tools/stimme-test.py
      - name: Proben ablegen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Stimmen-Vergleich: Proben"
          git pull --rebase origin main
          git push origin HEAD:main
