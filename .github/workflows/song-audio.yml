name: Song des Tages – Audio

on:
  push:
    branches: [main]
    paths:
      - 'data/songs.json'
      - 'tools/song-audio.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg installieren
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Audiodateien erzeugen (Gemini-Sprachausgabe)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          python3 tools/song-audio.py 2>&1 | tee audio/last-run.log
      - name: Audiodateien hochladen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "Keine neuen Audiodateien"; exit 0; fi
          git commit -m "Song des Tages: Audiodatei erzeugt"
          git pull --rebase origin main
          git push origin HEAD:main
