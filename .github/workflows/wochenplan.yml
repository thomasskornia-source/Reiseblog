name: Wochenplaner-Rezeptliste

on:
  push:
    branches: [main]
    paths:
      - 'rezepte/**'
      - 'tools/rezept-index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rezeptliste für den Wochenplaner neu schreiben
        run: python3 tools/rezept-index.py
      - name: Änderung hochladen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wochenplan.json
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -m "Wochenplaner: Rezeptliste aktualisiert"
          git pull --rebase origin main
          git push origin HEAD:main
