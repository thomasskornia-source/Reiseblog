name: Konzertmodus – Special bauen

# Startet, wenn Thomas ein Issue mit dem Titel "Konzert: <Band> (<Stadt>)" anlegt (Link auf der Musik-Seite),
# oder von Hand. Fremde Issues werden ignoriert (nur der Besitzer des Repos zählt).
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      artist:
        description: 'Interpret oder Band'
        required: true
      city:
        description: 'Stadt'
        required: true
      neu:
        description: 'Vorhandenes Special neu erzeugen (ja/nein)'
        default: 'nein'

permissions:
  contents: write
  issues: write

concurrency:
  group: konzert

jobs:
  bauen:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == 'thomasskornia-source' && startsWith(github.event.issue.title, 'Konzert:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg installieren
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Special erzeugen (Gemini mit Websuche und Sprachausgabe)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARTIST: ${{ inputs.artist }}
          CITY: ${{ inputs.city }}
          NEU: ${{ inputs.neu == 'ja' && '1' || '' }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 tools/konzert-bauen.py 2>&1 | tee /tmp/konzert-log.txt
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/konzerte audio
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Konzertmodus: Special erzeugt"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Issue beantworten und schließen
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          NR: ${{ github.event.issue.number }}
        run: |
          FUSS=$(printf '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_')
          if grep -q "^Fertig:" /tmp/konzert-log.txt || grep -q "gibt es schon" /tmp/konzert-log.txt; then
            gh issue comment "$NR" --body "Special ist online (nach ca. 1 bis 2 Minuten auf der Seite sichtbar). Aktualisiere die Startseite.$FUSS"
          else
            gh issue comment "$NR" --body "Das Special konnte nicht erzeugt werden. Details im Lauf unter Actions.$FUSS"
          fi
          gh issue close "$NR" || true
