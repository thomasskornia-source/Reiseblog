name: Vergnügen – Tipps sammeln

on:
  schedule:
    # zweimal täglich, abseits von Koch (13:30/14:30, 19:45/20:45, 23:00 UTC) und Rätsel-Audio (00:20, 06:20 UTC)
    - cron: '10 9 * * *'    # 11:10 bzw. 10:10 deutsche Zeit
    - cron: '40 16 * * *'   # 18:40 bzw. 17:40 deutsche Zeit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vergnuegen

jobs:
  sammeln:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tipps aus den Quellen holen (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          python3 tools/vergnuegen-sammeln.py 2>&1 | tee data/vergnuegen-log.txt
      - name: Daten ablegen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Vergnügen: Tipps aktualisiert"
          git pull --rebase origin main
          git push origin HEAD:main
