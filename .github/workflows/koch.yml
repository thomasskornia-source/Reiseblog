name: Börsenstimmung (Markus Koch)

on:
  schedule:
    # Deutsche Zeit: 15:30 und 21:45, dazu 01:00 als Nachholversuch. GitHub plant nur in UTC: Sommer- und Winterzeit-Variante,
    # die jeweils falsche überspringt der Job „zeit“.
    - cron: '30 13 * * *'   # Sommer 15:30
    - cron: '45 19 * * *'   # Sommer 21:45
    - cron: '30 14 * * *'   # Winter 15:30
    - cron: '45 20 * * *'   # Winter 21:45
    - cron: '0 23 * * *'    # Nachholversuch (Sommer 01:00, Winter 00:00)
  workflow_dispatch:
    inputs:
      seed:
        description: 'Video-Links oder IDs (optional, durch Leerzeichen getrennt)'
        required: false
      neu:
        description: 'Leer lassen; "ja" wertet die angegebenen Videos erneut aus'
        required: false

permissions:
  contents: write

concurrency:
  group: koch

jobs:
  zeit:
    runs-on: ubuntu-latest
    outputs:
      los: ${{ steps.g.outputs.los }}
    steps:
      - id: g
        env:
          PLAN: ${{ github.event.schedule }}
          SOMMER: '30 13 * * *|45 19 * * *'
          WINTER: '30 14 * * *|45 20 * * *'
        run: |
          los=ja
          if [ -n "$PLAN" ]; then
            if [ "$(TZ=Europe/Berlin date +%z)" = "+0200" ]; then falsch="$WINTER"; else falsch="$SOMMER"; fi
            case "|$falsch|" in *"|$PLAN|"*) los=nein;; esac
          fi
          echo "Plan: ${PLAN:-von Hand}, Berlin: $(TZ=Europe/Berlin date +%H:%M), los: $los"
          echo "los=$los" >> "$GITHUB_OUTPUT"
  koch:
    needs: zeit
    if: needs.zeit.outputs.los == 'ja'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Neue Beiträge auswerten (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEED_VIDEOS: ${{ inputs.seed }}
          NEU: ${{ inputs.neu }}
        run: |
          set -o pipefail
          python3 tools/koch-sammeln.py 2>&1 | tee auswertung/koch-last-run.log
      - name: Indikator-Katalog aktualisieren
        run: python3 tools/koch-katalog.py
      - name: Tagesdaten aufräumen
        run: python3 tools/aufraeumen.py
      - name: Daten ablegen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data auswertung audio
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Börsenstimmung: neue Auswertung"
          git pull --rebase origin main
          git push origin HEAD:main
