name: Marktstimmung S&P 500

on:
  schedule:
    - cron: '15 22 * * 1-5'   # nach US-Börsenschluss (Sommer 20:00, Winter 21:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: markt
  cancel-in-progress: false

jobs:
  markt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: S&P 500 auswerten
        run: python3 tools/markt.py
      - name: Änderung hochladen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markt.json
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -m "Marktstimmung S&P 500 aktualisiert"
          git pull --rebase origin main
          git push origin HEAD:main
