name: Top 10 S&P 500

on:
  schedule:
    - cron: '30 22 * * 1-5'   # nach US-Börsenschluss und nach der Marktstimmung
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: top10
  cancel-in-progress: false

jobs:
  top10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: S&P 500 durchsuchen
        env:
          SEC_KONTAKT: ${{ secrets.SEC_KONTAKT }}
        run: python3 tools/screener.py
      - name: Änderung hochladen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/top10.json data/beobachtung.json data/breite.json data/sektoren.json data/sektoren-archiv.json
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -m "Top 10 S&P 500 aktualisiert"
          git pull --rebase origin main
          git push origin HEAD:main
