name: Börsen-Beitrag – Testauswertung

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube-Link'
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Beitrag auswerten (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_URL: ${{ inputs.url }}
        run: |
          set -o pipefail
          mkdir -p auswertung
          python3 tools/video-analyse.py 2>&1 | tee auswertung/last-run.log
      - name: Ergebnis ablegen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auswertung
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Testauswertung Börsen-Beitrag"
          git pull --rebase origin main
          git push origin HEAD:main
