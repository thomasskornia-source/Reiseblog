name: Option Flows sammeln

on:
  schedule:
    - cron: '25 22 * * 1-5'   # nach US-Börsenschluss (Sommer 20:00, Winter 21:00 UTC), nach der Marktstimmung
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flows
  cancel-in-progress: false

jobs:
  flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tageswerte sammeln
        run: python3 tools/flows-sammeln.py
      - name: Änderung hochladen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flows
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -m "Option Flows: Tageswerte gesammelt"
          git pull --rebase origin main
          git push origin HEAD:main
