<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<title>WCJ – Aktienanalyse</title>
<link rel="stylesheet" href="styles.css?v=13">
<link rel="stylesheet" href="site.css?v=29">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  .an { max-width: 820px; margin: 0 auto; padding-bottom: 56px; }
  .an .zurueck { display: inline-block; margin: 8px 0 0; font-size: 14.5px; color: var(--ink-soft); }
  .an h1 { margin-bottom: 2px; }
  .an .stand { color: var(--ink-soft); font-size: 14px; margin: 4px 0 12px; }
  .an .box { background: var(--paper); border: 1px solid rgba(46,58,50,.12); border-radius: 14px; padding: 12px 16px; font-size: 14px; line-height: 1.55; color: var(--ink-soft); margin: 0 0 14px; }
  .an .box b { color: var(--ink); }
  .an .box.warn { background: #fbf4e2; border-color: rgba(176,122,14,.35); color: #7d5a10; }
  .an .kurz { font-size: 17px; line-height: 1.6; margin: 0 0 16px; }
  .an .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
  .an .tabs button { font: inherit; font-size: 15px; padding: 9px 16px; border-radius: 99px; border: 1px solid rgba(46,58,50,.18); background: #fff; color: var(--ink); cursor: pointer; }
  .an .tabs button[aria-selected="true"] { background: #262F63; color: #fff; border-color: #262F63; }
  .an h2 { font-family: 'Fraunces', serif; font-size: 22px; margin: 20px 0 8px; }
  .an h3 { font-size: 16.5px; margin: 18px 0 6px; }
  .an p, .an li { font-size: 15.5px; line-height: 1.6; }
  .an ul { padding-left: 20px; margin: 6px 0 10px; }
  .an .zwei ul { list-style: none; padding: 0; margin: 6px 0 2px; }
  .an .zwei li { position: relative; padding: 9px 0 9px 28px; margin: 0; border-top: 1px solid rgba(46,58,50,.1); font-size: 15px; line-height: 1.5; }
  .an .zwei li:first-child { border-top: 0; }
  .an .zwei li::before { position: absolute; left: 2px; top: 9px; width: 18px; height: 18px; border-radius: 50%; text-align: center; font-size: 13px; line-height: 18px; font-weight: 700; color: #fff; }
  .an .zwei .bull li::before { content: '+'; background: #1f8a5b; }
  .an .zwei .bear li::before { content: '–'; background: #c8453f; }
  .an li { margin: 0 0 6px; }
  .an .tab { margin: 0 0 8px; }
  .an .tab-intro { color: var(--ink-soft); font-size: 14.5px; }
  .an sup a { text-decoration: none; font-weight: 700; color: #262F63; padding: 0 1px; }
  .an .kk { width: 100%; border-collapse: collapse; font-size: 14.5px; margin: 6px 0 12px; }
  .an .kk th, .an .kk td { word-break: break-word; min-width: 90px; text-align: left; vertical-align: top; padding: 8px 8px; border-bottom: 1px solid rgba(46,58,50,.1); }
  .an .kk th { font-size: 13px; color: var(--ink-soft); }
  .an .zwei { display: grid; grid-template-columns: 1fr; gap: 14px; margin: 8px 0 14px; }
  .an .zwei > div { border-radius: 16px; padding: 14px 18px; border: 0; }
  .an .zwei .bull { background: #eaf4ee; } .an .zwei .bear { background: #fbeceb; }
  .an .zwei h3 { margin-top: 2px; }
  .an .unklar { background: #f3f1ea; border: 1px dashed rgba(46,58,50,.3); border-radius: 14px; padding: 10px 16px; margin: 12px 0; }
  .an .quellen { font-size: 13.5px; }
  .an .quellen li { font-size: 13.5px; margin-bottom: 4px; word-break: break-word; }
  .an .quellen a { color: inherit; }
  .an .leer { color: var(--ink-soft); padding: 14px 2px; }
  .an .liste { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .an .liste a { display: block; padding: 12px 16px; border-radius: 14px; border: 1px solid rgba(46,58,50,.12); background: #fff; text-decoration: none; color: var(--ink); }
  .an .liste a small { display: block; color: var(--ink-soft); font-size: 13px; margin-top: 2px; }
  @media (min-width: 1100px) {
    body.pc .an { max-width: 1180px; }
    .an .zwei { grid-template-columns: 1fr 1fr; }
    .an .liste { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  }
</style>
</head>
<body class="page-wide pc">
<nav class="topbar" id="topbar"><div class="topin">
    <a class="brand" href="index.html"><img src="icon-180.png?v=4" alt=""><span class="bt">Unterwegs und zuhause</span></a>
    <div class="topnav">
      <a href="aktien.html">WCJ</a>
      <a href="quiz.html">München</a>
      <a href="reisen.html">Reisen</a>
      <a href="rezepte.html">Rezepte</a>
      <a href="finanzplanung.html">Finanzplanung</a>
      <a href="ernaehrung.html">Ernährung</a>
      <a href="notfallvorrat.html">Notfallvorrat</a>
    </div>
  </div></nav>
<div class="wrap an">
  <a class="zurueck" href="aktien.html">← Zurück zu WCJ</a>
  <header class="entry-header">
    <h1 id="titel">Aktienanalyse</h1>
    <hr class="rule">
  </header>
  <div id="inhalt"><p class="leer">Lädt …</p></div>
</div>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  // Text mit Quellenmarken [1] oder [1,3] -> hochgestellte Links zur Quellenliste
  function tx(s) {
    return esc(s).replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, function (m, g) {
      return '<sup>' + g.split(',').map(function (n) { n = n.trim(); return '<a href="#q' + n + '" aria-label="Quelle ' + n + '">[' + n + ']</a>'; }).join('') + '</sup>';
    });
  }
  function liste(a) { return a && a.length ? '<ul>' + a.map(function (p) { return '<li>' + tx(p) + '</li>'; }).join('') + '</ul>' : ''; }
  function abschnitt(a) {
    var h = '';
    if (a.h) h += '<h3>' + esc(a.h) + '</h3>';
    if (a.text) h += '<p>' + tx(a.text) + '</p>';
    h += liste(a.punkte);
    if (a.tabelle && a.tabelle.zeilen) {
      h += '<div style="overflow-x:auto"><table class="kk"><thead><tr>' + a.tabelle.kopf.map(function (k) { return '<th>' + esc(k) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        a.tabelle.zeilen.map(function (z) { return '<tr>' + z.map(function (c) { return '<td>' + tx(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    }
    if (a.unklar && a.unklar.length) h += '<div class="unklar"><b>Unklar / nicht gefunden</b>' + liste(a.unklar) + '</div>';
    return h;
  }
  function zeige(d) {
    document.title = 'WCJ – Analyse ' + d.ticker;
    $('titel').textContent = d.name + ' (' + d.ticker + ')';
    var teile = d.teile || [], h = '';
    h += '<p class="stand">Stand ' + esc(d.stand) + ' · erstellt von ' + esc(d.erstellt_von || 'Claude') + ' aus öffentlichen Quellen (Quellenliste unten)</p>';
    h += '<div class="box warn"><b>Keine Anlageberatung.</b> Das ist eine Einordnung des Geschäfts, keine Bewertung: Es gibt bewusst keine Kursziele, keine Fair-Value-Rechnung und keine Kauf- oder Verkaufsempfehlung. Zahlen stammen aus den genannten Quellen; was ich nicht belegen konnte, steht als „unklar“ da.</div>';
    h += '<p class="kurz">' + tx(d.kurz) + '</p>';
    h += '<div class="tabs" role="tablist">' + teile.map(function (t, i) { return '<button type="button" role="tab" data-i="' + i + '" aria-selected="' + (i === 0) + '">' + esc(t.titel) + '</button>'; }).join('') + '</div>';
    h += '<div id="tabinh"></div>';
    h += '<h2>Quellen</h2><ol class="quellen">' + (d.quellen || []).map(function (q) {
      return '<li id="q' + q.n + '" value="' + q.n + '"><a href="' + esc(q.url) + '" target="_blank" rel="noopener">' + esc(q.titel) + '</a>' + (q.art ? ' · ' + esc(q.art) : '') + (q.datum ? ' · ' + esc(q.datum) : '') + '</li>';
    }).join('') + '</ol>';
    $('inhalt').innerHTML = h;
    function tab(i) {
      var t = teile[i], s = '';
      if (t.intro) s += '<p class="tab-intro">' + tx(t.intro) + '</p>';
      if (t.bull || t.bear) {
        s += '<div class="zwei"><div class="bull"><h3>Das spricht dafür (Bull-Lesart)</h3>' + liste(t.bull) + '</div><div class="bear"><h3>Das spricht dagegen (Bear-Lesart)</h3>' + liste(t.bear) + '</div></div>';
      }
      (t.abschnitte || []).forEach(function (a) { s += abschnitt(a); });
      if (t.kausal && t.kausal.length) {
        s += '<h3>Ursache → Wirkung → Gewinn-und-Verlust / Cashflow</h3><div style="overflow-x:auto"><table class="kk"><thead><tr><th>Treiber</th><th>Wirkung im Geschäft</th><th>Spur in Zahlen</th></tr></thead><tbody>' +
          t.kausal.map(function (k) { return '<tr><td>' + tx(k[0]) + '</td><td>' + tx(k[1]) + '</td><td>' + tx(k[2]) + '</td></tr>'; }).join('') + '</tbody></table></div>';
      }
      if (t.beobachten && t.beobachten.length) s += '<h3>Was man beobachten sollte</h3>' + liste(t.beobachten);
      if (t.unklar && t.unklar.length) s += '<div class="unklar"><b>Unklar / nicht gefunden</b>' + liste(t.unklar) + '</div>';
      $('tabinh').innerHTML = '<h2>' + esc(t.titel) + '</h2>' + s;
    }
    var tabs = document.querySelectorAll('.tabs button');
    tabs.forEach(function (b) {
      b.addEventListener('click', function () {
        tabs.forEach(function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
        tab(+b.getAttribute('data-i'));
        try { history.replaceState(null, '', '#t' + b.getAttribute('data-i')); } catch (e) {}
      });
    });
    var start = 0; try { var m = /#t(\d)/.exec(location.hash); if (m && teile[+m[1]]) start = +m[1]; } catch (e) {}
    if (start) { tabs.forEach(function (x, i) { x.setAttribute('aria-selected', i === start ? 'true' : 'false'); }); }
    tab(start);
  }
  var t = (new URLSearchParams(location.search).get('t') || '').toUpperCase().replace(/[^A-Z0-9\-]/g, '');
  if (!t) {
    fetch('data/analysen/index.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (ix) {
      $('titel').textContent = 'Aktienanalysen';
      $('inhalt').innerHTML = '<p class="tab-intro">Ausführliche Analysen: Branche, Wettbewerber, Unternehmen und Gesamtbericht aus öffentlichen Quellen. Ohne Kursziel und ohne Empfehlung.</p><div class="liste">' +
        ix.aktien.map(function (a) { return '<a href="analyse.html?t=' + encodeURIComponent(a.ticker) + '"><b>' + esc(a.ticker) + '</b> · ' + esc(a.name) + '<small>Stand ' + esc(a.stand) + '</small></a>'; }).join('') + '</div>';
    }).catch(function () { $('inhalt').innerHTML = '<p class="leer">Noch keine Analysen vorhanden.</p>'; });
    return;
  }
  fetch('data/analysen/' + t + '.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(zeige).catch(function () {
    $('titel').textContent = 'Analyse ' + t;
    $('inhalt').innerHTML = '<p class="leer">Für ' + esc(t) + ' gibt es noch keine ausführliche Analyse. Sag Claude im Chat Bescheid, dann wird sie erstellt.</p><p><a href="analyse.html">Alle Analysen ansehen</a></p>';
  });
})();
</script>
<script src="nav.js?v=21" defer></script>
</body>
</html>
